name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: canteen_user
          POSTGRES_PASSWORD: canteen_pass
          POSTGRES_DB: canteen_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://canteen_user:canteen_pass@localhost:5432/canteen_test_db
      DATABASE_URL: postgresql://canteen_user:canteen_pass@localhost:5432/canteen_test_db
      FLASK_SECRET_KEY: ci-test-secret

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff lint check
        run: ruff check .

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U canteen_user; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Initialize test database table
        run: python init_test_db.py

      - name: Run pytest
        run: pytest -v